<div class="container">
    <div class="age-card">
        <div class="card-header">
            <h1>⏰ Countdown Timer</h1>
            <p>Set hours, minutes, seconds and watch the countdown!</p>
        </div>
        <div class="card-content">
            <div class="timer-display">
                <div class="time" id="countdownDisplay">00:00:00</div>
                <div class="status" id="timerStatus">⏸ Ready</div>
            </div>

            <div class="timer-inputs">
                <div class="input-group">
                    <label>Hours</label>
                    <input type="number" id="hoursInput" value="0" min="0" max="99">
                </div>
                <div class="input-group">
                    <label>Minutes</label>
                    <input type="number" id="minutesInput" value="5" min="0" max="59">
                </div>
                <div class="input-group">
                    <label>Seconds</label>
                    <input type="number" id="secondsInput" value="0" min="0" max="59">
                </div>
            </div>

            <div class="timer-controls">
                <button class="btn-start" id="startCountdown">▶ Start</button>
                <button class="btn-pause" id="pauseCountdown" disabled>⏸ Pause</button>
                <button class="btn-reset" id="resetCountdown">↺ Reset</button>
            </div>

        </p>
    </footer>
</div>

<script>
let countdownInterval = null;
let totalSeconds = 0;
let remainingSeconds = 0;
let isRunning = false;
let isPaused = false;
let isEnded = false;

function updateCountdownDisplay() {
    const h = String(Math.floor(remainingSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((remainingSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(remainingSeconds % 60).padStart(2, '0');
    document.getElementById('countdownDisplay').innerText = h + ':' + m + ':' + s;
}

function getInputValues() {
    const hours = parseInt(document.getElementById('hoursInput').value) || 0;
    const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
    const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
    return hours * 3600 + minutes * 60 + seconds;
}

function startCountdown() {
    if (isRunning) return;
    
    if (!isPaused) {
        totalSeconds = getInputValues();
        if (totalSeconds <= 0) {
            alert('Please enter a valid time!');
            return;
        }
        remainingSeconds = totalSeconds;
        document.getElementById('hoursInput').disabled = true;
        document.getElementById('minutesInput').disabled = true;
        document.getElementById('secondsInput').disabled = true;
    }
    
    isRunning = true;
    isPaused = false;
    isEnded = false;
    document.getElementById('timerStatus').innerText = '▶ Running...';
    document.getElementById('timerStatus').className = 'status running';
    document.getElementById('startCountdown').disabled = true;
    document.getElementById('pauseCountdown').disabled = false;
    document.getElementById('startCountdown').innerHTML = '▶ Running...';
    
    countdownInterval = setInterval(() => {
        remainingSeconds--;
        updateCountdownDisplay();
        
        if (remainingSeconds <= 0) {
            clearInterval(countdownInterval);
            isRunning = false;
            isEnded = true;
            document.getElementById('timerStatus').innerText = '⏰ Time\'s Up! 🎉';
            document.getElementById('timerStatus').className = 'status ended';
            document.getElementById('startCountdown').disabled = false;
            document.getElementById('pauseCountdown').disabled = true;
            document.getElementById('startCountdown').innerHTML = '▶ Start';
            // Alert sound effect (beep)
            try {
                const audio = new Audio('data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAACBhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqFhYqF');
            } catch(e) {}
        }
    }, 1000);
}

function pauseCountdown() {
    if (isRunning && !isPaused) {
        clearInterval(countdownInterval);
        isPaused = true;
        isRunning = false;
        document.getElementById('timerStatus').innerText = '⏸ Paused';
        document.getElementById('timerStatus').className = 'status paused';
        document.getElementById('startCountdown').disabled = false;
        document.getElementById('pauseCountdown').disabled = true;
        document.getElementById('startCountdown').innerHTML = '▶ Resume';
    }
}

function resetCountdown() {
    clearInterval(countdownInterval);
    isRunning = false;
    isPaused = false;
    isEnded = false;
    document.getElementById('hoursInput').disabled = false;
    document.getElementById('minutesInput').disabled = false;
    document.getElementById('secondsInput').disabled = false;
    document.getElementById('startCountdown').disabled = false;
    document.getElementById('pauseCountdown').disabled = true;
    document.getElementById('startCountdown').innerHTML = '▶ Start';
    document.getElementById('timerStatus').innerText = '⏸ Ready';
    document.getElementById('timerStatus').className = 'status';
    remainingSeconds = getInputValues();
    updateCountdownDisplay();
}

document.getElementById('startCountdown').addEventListener('click', startCountdown);
document.getElementById('pauseCountdown').addEventListener('click', pauseCountdown);
document.getElementById('resetCountdown').addEventListener('click', resetCountdown);

// Auto-update display on input change
document.querySelectorAll('.timer-inputs input').forEach(input => {
    input.addEventListener('change', function() {
        if (!isRunning && !isPaused) {
            remainingSeconds = getInputValues();
            updateCountdownDisplay();
        }
    });
});

// Initial display
remainingSeconds = getInputValues();
updateCountdownDisplay();
</script>
