<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Free Instagram Hashtag Generator - Get Viral Hashtags</title>
    
    <meta name="description" content="Free Instagram hashtag generator tool. Generate trending, viral & niche-specific hashtags for Instagram reels, posts & stories instantly. Boost your reach & engagement. No signup required.">
    
    <link rel="canonical" href="https://freeonlinetools203.com/instagram-hashtag-generator.html">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EQ8DLY7HYN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EQ8DLY7HYN');

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#f3f4f6 0%,#e5e7eb 100%);min-height:100vh;}
        
        .container{max-width:1100px;margin:40px auto;padding:0 20px;}
        .tool-card{background:white;border-radius:28px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);overflow:hidden;margin-bottom:35px;}
        .card-header{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);padding:35px 30px;text-align:center;}
        .card-header h1{color:white;font-size:32px;margin-bottom:12px;}
        .card-header p{color:rgba(255,255,255,0.95);font-size:16px;}
        .card-content{padding:40px;}
        
        .input-group{margin-bottom:25px;}
        .input-group label{display:block;font-weight:700;color:#1e3a8a;margin-bottom:8px;font-size:14px;}
        .keyword-input{width:100%;padding:16px 20px;border:2px solid #e2e8f0;border-radius:60px;font-size:16px;transition:all 0.3s;}
        .keyword-input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
        
        .generate-btn{background:linear-gradient(135deg,#2563eb 0%,#1e3a8a 100%);color:white;border:none;padding:16px 32px;border-radius:60px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s;width:100%;margin-bottom:25px;}
        .generate-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(37,99,235,0.3);}
        
        /* Result Section */
        .result-section{background:#f8fafc;border-radius:24px;padding:25px;display:none; margin-top: 10px;}
        .result-section.show{display:block;animation:slideUp 0.4s ease;}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        
        .hashtags-container{background:#1e293b;border-radius:20px;padding:20px;margin-bottom:20px;}
        .hashtags-text{font-family:monospace;font-size:14px;color:#5eead4;word-break:break-all;line-height:1.6;}
        
        /* Action Buttons */
        .action-buttons{display:flex;gap:12px;flex-wrap:wrap;}
        .action-btn{flex:1;padding:14px;border-radius:60px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all 0.3s;min-width: 120px;}
        
        .btn-copy{background:#10b981;color:white;}
        .btn-copy:hover{background:#059669;}
        
        .btn-download{background:#3b82f6;color:white;}
        .btn-download:hover{background:#2563eb;}
        
        .btn-clear{background:#fee2e2;color:#dc2626;}
        .btn-clear:hover{background:#fecaca;}
        
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1f2937;color:white;padding:12px 24px;border-radius:60px;font-size:14px;z-index:1000;animation:toastSlide 0.3s;box-shadow:0 10px 25px rgba(0,0,0,0.2);}
        @keyframes toastSlide{from{opacity:0;transform:translateX(-50%) translateY(30px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
        
        @media (max-width:768px){
            .card-content{padding:25px 20px;}
            .action-buttons{flex-direction:column;}
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tool-card">
        <div class="card-header">
            <h1>📸 Instagram Hashtag Generator</h1>
            <p>Generate trending, viral, and niche-specific hashtags for Instagram | Boost your reach & engagement</p>
        </div>
        <div class="card-content">
            
            <div class="input-group">
                <label>🔑 Enter Keyword / Niche</label>
                <input type="text" id="keywordInput" class="keyword-input" placeholder="e.g., fashion, food, travel, fitness, business, marketing, beauty">
            </div>

            <button class="generate-btn" id="generateBtn">✨ Generate Hashtags</button>

            <!-- Result Section (Generate button ke theek neechay) -->
            <div id="resultSection" class="result-section">
                <div class="hashtags-container">
                    <div class="hashtags-text" id="hashtagsResult">#example #hashtags #will #appear #here</div>
                </div>
                
                <!-- 3 Action Buttons -->
                <div class="action-buttons">
                    <button class="action-btn btn-copy" id="copyBtn">📋 Copy Hashtags</button>
                    <button class="action-btn btn-download" id="downloadBtn">💾 Download TXT</button>
                    <button class="action-btn btn-clear" id="clearBtn">🗑️ Clear All</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
// Hashtags Database
const hashtagsDB = {
    general: ['#viral', '#trending', '#explore', '#explorepage', '#fyp', '#foryou', '#foryoupage', '#reels', '#reelsinstagram', '#instagood', '#instagram', '#socialmedia', '#instadaily', '#photooftheday', '#likeforlikes'],
    fashion: ['#fashion', '#style', '#outfit', '#ootd', '#fashionblogger', '#streetstyle', '#luxury', '#designer', '#trendy', '#vintage', '#moda', '#stylish', '#fashionista', '#styleinspo'],
    food: ['#food', '#foodie', '#foodporn', '#instafood', '#foodphotography', '#yummy', '#delicious', '#homemade', '#cooking', '#recipe', '#healthyfood', '#foodstagram', '#foodlover'],
    travel: ['#travel', '#travelgram', '#wanderlust', '#adventure', '#nature', '#photography', '#explore', '#vacation', '#beach', '#sunset', '#roadtrip', '#travelblogger', '#beautifuldestinations'],
    fitness: ['#fitness', '#gym', '#workout', '#motivation', '#fit', '#health', '#training', '#exercise', '#bodybuilding', '#yoga', '#cardio', '#strength', '#fitnessmotivation', '#gymlife'],
    business: ['#business', '#entrepreneur', '#startup', '#success', '#money', '#marketing', '#leadership', '#motivation', '#goals', '#wealth', '#investing', '#businessowner', '#smallbusiness'],
    marketing: ['#marketing', '#digitalmarketing', '#socialmedia', '#seo', '#contentmarketing', '#branding', '#advertising', '#strategy', '#emailmarketing', '#marketingtips', '#socialmediamarketing'],
    technology: ['#technology', '#tech', '#innovation', '#future', '#coding', '#programming', '#developer', '#ai', '#blockchain', '#cybersecurity', '#software', '#gadgets', '#technews'],
    beauty: ['#beauty', '#makeup', '#skincare', '#hair', '#cosmetics', '#beautytips', '#glowup', '#selfcare', '#naturalbeauty', '#beautyblogger', '#makeuptutorial', '#skincareroutine'],
    photography: ['#photography', '#photographer', '#photo', '#photooftheday', '#instaphoto', '#naturephotography', '#portraitphotography', '#photographylovers', '#click'],
    motivation: ['#motivation', '#inspiration', '#success', '#goals', '#dreams', '#hustle', '#mindset', '#positivevibes', '#nevergiveup', '#believe', '#motivationalquotes']
};

let currentHashtags = [];

function getHashtagsForKeyword(keyword) {
    let keywordLower = keyword.toLowerCase().trim();
    let baseHashtags = [];
    
    if(hashtagsDB[keywordLower]) baseHashtags = [...hashtagsDB[keywordLower]];
    else if(keywordLower.includes('fashion')) baseHashtags = [...hashtagsDB.fashion];
    else if(keywordLower.includes('food')) baseHashtags = [...hashtagsDB.food];
    else if(keywordLower.includes('travel')) baseHashtags = [...hashtagsDB.travel];
    else if(keywordLower.includes('fitness') || keywordLower.includes('gym') || keywordLower.includes('workout')) baseHashtags = [...hashtagsDB.fitness];
    else if(keywordLower.includes('business') || keywordLower.includes('entrepreneur')) baseHashtags = [...hashtagsDB.business];
    else if(keywordLower.includes('market')) baseHashtags = [...hashtagsDB.marketing];
    else if(keywordLower.includes('tech')) baseHashtags = [...hashtagsDB.technology];
    else if(keywordLower.includes('beauty') || keywordLower.includes('makeup')) baseHashtags = [...hashtagsDB.beauty];
    else if(keywordLower.includes('photo')) baseHashtags = [...hashtagsDB.photography];
    else if(keywordLower.includes('motivation') || keywordLower.includes('inspire')) baseHashtags = [...hashtagsDB.motivation];
    else baseHashtags = [...hashtagsDB.general];
    
    const keywordTags = [`#${keywordLower}`, `#${keywordLower}love`, `#${keywordLower}life`, `#${keywordLower}style`, `#${keywordLower}addict`, `#${keywordLower}inspo`, `#${keywordLower}gram`, `#${keywordLower}oftheday`, `#${keywordLower}community`, `#${keywordLower}vibes`, `#${keywordLower}goals`];
    
    let allHashtags = [...baseHashtags, ...keywordTags, ...hashtagsDB.general];
    allHashtags = [...new Set(allHashtags)];
    allHashtags = allHashtags.slice(0, 28);
    
    return [...new Set(allHashtags)];
}

function generateHashtags() {
    const keyword = document.getElementById('keywordInput').value.trim();
    if(!keyword) {
        showToast('❌ Please enter a keyword or niche');
        return;
    }
    
    currentHashtags = getHashtagsForKeyword(keyword);
    const hashtagsText = currentHashtags.join(' ');
    document.getElementById('hashtagsResult').textContent = hashtagsText;
    document.getElementById('resultSection').classList.add('show');
    
    // Result tak scroll karein
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    
    showToast(`✅ Hashtags generated for "${keyword}"!`);
}

function copyHashtags() {
    if(currentHashtags.length === 0) return;
    const text = currentHashtags.join(' ');
    
    if(navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            showToast('📋 All hashtags copied!');
        }).catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    showToast('📋 All hashtags copied!');
}

function downloadTXT() {
    if(currentHashtags.length === 0) return;
    const keyword = document.getElementById('keywordInput').value.trim();
    const content = `Instagram Hashtags for ${keyword}\nGenerated: ${new Date().toLocaleString()}\nTotal: ${currentHashtags.length} hashtags\n\n${currentHashtags.join(' ')}\n\n--- Tips ---\nUse 15-20 hashtags per post\nMix trending + niche hashtags\nUpdate hashtags every few posts`;
    
    const blob = new Blob([content], {type: 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `instagram_hashtags_${keyword.replace(/\s/g,'_')}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('💾 TXT file downloaded!');
}

function clearAll() {
    document.getElementById('keywordInput').value = '';
    document.getElementById('resultSection').classList.remove('show');
    currentHashtags = [];
    showToast('🗑️ Cleared! Enter new keyword.');
    document.getElementById('keywordInput').focus();
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}

// Event Listeners
document.getElementById('generateBtn').addEventListener('click', generateHashtags);
document.getElementById('copyBtn').addEventListener('click', copyHashtags);
document.getElementById('downloadBtn').addEventListener('click', downloadTXT);
document.getElementById('clearBtn').addEventListener('click', clearAll);
document.getElementById('keywordInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') generateHashtags(); });

// Default Value
window.addEventListener('load', () => {
    document.getElementById('keywordInput').value = 'fashion';
});
</script>
</body>
</html>
