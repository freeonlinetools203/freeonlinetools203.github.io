<style>

<body>

<div class="container">
  <div class="tool-card">
    <div class="card-header">
      <h1>🖼️ Free WebP Converter</h1>
      <p>Convert WebP to JPG, PNG, BMP instantly — 100% Free, No Signup, No Watermark</p>
    </div>
    <div class="card-content">

      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📤</div>
        <div class="upload-title">Click to upload or drag & drop WebP images</div>
        <div class="upload-hint">Supports .webp files — Multiple files allowed</div>
        <input type="file" id="fileInput" accept=".webp,image/webp" multiple style="display:none">
      </div>

      <div class="file-list" id="fileList"></div>

      <div class="format-selector">
        <label>🎨 Output Format:</label>
        <div class="format-options">
          <div class="format-option active" data-format="image/jpeg">JPG</div>
          <div class="format-option" data-format="image/png">PNG</div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn-primary" id="convertBtn" disabled>🔄 Convert Now</button>
        <button class="btn-secondary" id="downloadAllBtn" style="display:none;">⬇️ Download All</button>
        <button class="btn-secondary" id="clearBtn">🗑️ Clear</button>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-number">100%</div><div class="stat-label">Free</div></div>
        <div class="stat"><div class="stat-number">🔒</div><div class="stat-label">Private</div></div>
        <div class="stat"><div class="stat-number">⚡</div><div class="stat-label">Instant</div></div>
        <div class="stat"><div class="stat-number">∞</div><div class="stat-label">Unlimited</div></div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast">Message</div>

<script>
(function(){
  var files = [];
  var convertedFiles = [];
  var selectedFormat = 'image/jpeg';
  var fileIdCounter = 0;

  var uploadArea = document.getElementById('uploadArea');
  var fileInput = document.getElementById('fileInput');
  var fileList = document.getElementById('fileList');
  var convertBtn = document.getElementById('convertBtn');
  var downloadAllBtn = document.getElementById('downloadAllBtn');
  var clearBtn = document.getElementById('clearBtn');
  var toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 2500);
  }

  function formatSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1048576).toFixed(2) + ' MB';
  }

  function renderFiles(){
    if(files.length === 0){
      fileList.innerHTML = '';
      convertBtn.disabled = true;
      downloadAllBtn.style.display = 'none';
      return;
    }
    var html = '';
    files.forEach(function(f){
      var statusClass = f.status === 'success' ? 'status-success' : f.status === 'error' ? 'status-error' : 'status-pending';
      var statusText = f.status === 'success' ? '✅ Converted' : f.status === 'error' ? '❌ Error' : '⏳ Ready';
      html += '<div class="file-item">' +
        '<div class="file-item-info">' +
          '<span class="file-icon">🖼️</span>' +
          '<div>' +
            '<div class="file-name">' + f.file.name + '</div>' +
            '<div class="file-size">' + formatSize(f.file.size) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
          '<span class="file-status ' + statusClass + '">' + statusText + '</span>' +
          (f.status === 'success' ? '<button class="btn-secondary" style="padding:6px 16px;font-size:0.8rem;" onclick="window.downloadOne(' + f.id + ')">⬇️ Download</button>' : '') +
        '</div>' +
      '</div>';
    });
    fileList.innerHTML = html;
    convertBtn.disabled = files.filter(function(f){ return f.status === 'pending'; }).length === 0;
    downloadAllBtn.style.display = convertedFiles.length > 0 ? 'inline-block' : 'none';
  }

  window.downloadOne = function(id){
    var f = files.find(function(x){ return x.id === id; });
    if(!f || !f.blob) return;
    var ext = selectedFormat === 'image/png' ? 'png' : 'jpg';
    var baseName = f.file.name.replace(/\.webp$/i, '');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(f.blob);
    a.download = baseName + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('✅ Downloaded ' + a.download);
  };

  function handleFiles(fileListInput){
    var added = 0;
    for(var i = 0; i < fileListInput.length; i++){
      var f = fileListInput[i];
      if(!f.type.match(/webp/i) && !f.name.toLowerCase().endsWith('.webp')){
        showToast('❌ Only WebP files allowed: ' + f.name);
        continue;
      }
      files.push({ id: ++fileIdCounter, file: f, status: 'pending', blob: null });
      added++;
    }
    if(added > 0) showToast('✅ Added ' + added + ' file(s)');
    renderFiles();
  }

  uploadArea.addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(e){ handleFiles(e.target.files); fileInput.value = ''; });

  uploadArea.addEventListener('dragover', function(e){ e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', function(){ uploadArea.classList.remove('dragover'); });
  uploadArea.addEventListener('drop', function(e){
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  document.querySelectorAll('.format-option').forEach(function(opt){
    opt.addEventListener('click', function(){
      document.querySelectorAll('.format-option').forEach(function(o){ o.classList.remove('active'); });
      opt.classList.add('active');
      selectedFormat = opt.getAttribute('data-format');
    });
  });

  convertBtn.addEventListener('click', function(){
    var pending = files.filter(function(f){ return f.status === 'pending'; });
    if(pending.length === 0){ showToast('No files to convert'); return; }
    convertBtn.disabled = true;
    convertBtn.textContent = '⏳ Converting...';

    var done = 0;
    pending.forEach(function(f){
      var img = new Image();
      var url = URL.createObjectURL(f.file);
      img.onload = function(){
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        var ctx = canvas.getContext('2d');
        if(selectedFormat === 'image/jpeg'){
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(function(blob){
          f.blob = blob;
          f.status = 'success';
          URL.revokeObjectURL(url);
          done++;
          renderFiles();
          if(done === pending.length){
            convertBtn.textContent = '🔄 Convert Now';
            convertBtn.disabled = false;
            showToast('✅ All files converted!');
          }
        }, selectedFormat, 0.92);
      };
      img.onerror = function(){
        f.status = 'error';
        URL.revokeObjectURL(url);
        done++;
        renderFiles();
        if(done === pending.length){
          convertBtn.textContent = '🔄 Convert Now';
          convertBtn.disabled = false;
        }
      };
      img.src = url;
    });
  });

  downloadAllBtn.addEventListener('click', function(){
    var success = files.filter(function(f){ return f.status === 'success' && f.blob; });
    if(success.length === 0){ showToast('No converted files'); return; }
    success.forEach(function(f, i){
      setTimeout(function(){ window.downloadOne(f.id); }, i * 300);
    });
    showToast('⬇️ Downloading ' + success.length + ' file(s)...');
  });

  clearBtn.addEventListener('click', function(){
    files = [];
    fileIdCounter = 0;
    renderFiles();
    showToast('🗑️ Cleared');
  });

  renderFiles();
})();
</script>

</body>
</html>
