/* ===== CAT MASCOT ===== */
.cat-mascot-corner {
    position: absolute;
    right: 20px;
    bottom: 15px;
    width: 130px;
    height: 130px;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.5) translateY(20px);
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cat-mascot-corner.show {
    opacity: 1;
    transform: scale(1) translateY(0);
}
.cat-mascot-corner svg {
    animation: tailWiggle 3s ease-in-out infinite;
    transform-origin: bottom center;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
}
@keyframes tailWiggle {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(2deg); }
}
.cat-mascot-corner.celebrate { animation: catCelebrate 1.5s ease-in-out 3; }
@keyframes catCelebrate {
    0%   { transform: translateY(0) scale(1) rotate(0deg); }
    15%  { transform: translateY(-25px) scale(1.15) rotate(-10deg); }
    30%  { transform: translateY(0) scale(1) rotate(10deg); }
    45%  { transform: translateY(-25px) scale(1.15) rotate(-10deg); }
    60%  { transform: translateY(0) scale(1) rotate(10deg); }
    75%  { transform: translateY(-15px) scale(1.1) rotate(-5deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
}
.cat-bubble {
    position: absolute;
    right: 130px;
    bottom: 120px;
    background: white;
    color: #1e3a8a;
    padding: 10px 16px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    z-index: 3;
    pointer-events: none;
}
.cat-bubble.show { opacity: 1; transform: scale(1); }
.cat-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    right: 30px;
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 10px solid white;
}

    border-left: 4px solid #dc2626;
    padding: 12px 18px;
    border-radius: 6px;
    font-size: 0.82rem;
    color: #7f1d1d;
    margin-top: 25px;
}
.email-signup {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    padding: 30px 20px;
    border-radius: 16px;
    margin: 30px auto;
    max-width: 900px;
    text-align: center;
    color: white;
}
.email-signup h3 { color: white; margin-top: 0; font-size: 22px; }
.email-signup form {
    display: flex;
    gap: 10px;
    max-width: 450px;
    margin: 15px auto 0;
    flex-wrap: wrap;
    justify-content: center;
}
.email-signup input {
    flex: 1;
    padding: 14px 20px;
    border-radius: 50px;
    border: none;
    min-width: 200px;
    font-size: 15px;
    outline: none;
}
.email-signup button {
    background: #f59e0b;
    border: none;
    padding: 14px 32px;
    border-radius: 50px;
    color: white;
    font-weight: 700;
    cursor: pointer;
    font-size: 15px;
}
.toast-notification {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2937;
    color: white;
    padding: 12px 24px;
    border-radius: 40px;
    font-size: 14px;
    z-index: 1000;
    animation: slideUp 0.3s ease;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
@keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@media (max-width: 768px) {
    .card-header h1 { font-size: 20px; }
    .card-header p { font-size: 13px; }
    .card-content { padding: 20px; }
    .upload-area { padding: 35px 15px; }
    .aspect-buttons { justify-content: center; }
    .action-btn { min-width: 100%; }
    .cat-mascot-corner { width: 80px; height: 80px; right: 10px; bottom: 10px; }
    .cat-bubble { right: 90px; bottom: 80px; font-size: 11px; padding: 8px 12px; }
    .seo-article { padding: 25px 20px; }
    .article-header h2 { font-size: 22px; }
}

<div class="container">
    <div class="cropper-card">
        <div class="card-header">
            <h1>✂️ Image Cropper – Crop Images Online with Custom Aspect Ratios</h1>
            <p>Crop any image with custom aspect ratios. Perfect for social media, thumbnails, and design projects.</p>
        </div>
        <div class="card-content">

                        <button class="aspect-btn" data-ratio="16:9">16:9 (Widescreen)</button>
                        <button class="aspect-btn" data-ratio="3:2">3:2 (DSLR)</button>
                        <button class="aspect-btn" data-ratio="2:3">2:3 (Portrait)</button>
                        <button class="aspect-btn" data-ratio="4:5">4:5 (Instagram)</button>
                        <button class="aspect-btn" data-ratio="9:16">9:16 (Story)</button>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="action-btn crop" id="applyCropBtn">✂️ Apply Crop</button>
