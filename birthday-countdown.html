<script>
function updateLiveTime() {
    const now = new Date();
    const dateOpt = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('liveDate').innerText = now.toLocaleDateString(undefined, dateOpt);
    document.getElementById('liveTime').innerText = now.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: true });
    document.getElementById('liveTimezone').innerText = `Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;
}

// ============================================================
// ✅ FIXED: Birth Year Calculation - Ab Sahi Kaam Karega
// ============================================================
function calculateBirthYear() {
    const ageInput = document.getElementById('ageInput');
    const age = parseInt(ageInput.value);
    
    // Validation
    if (!age || age < 1) {
        alert('❌ Please enter a valid age!');
        return;
    }
    if (age > 150) {
        alert('❌ Please enter a realistic age!');
        return;
    }
    
    const now = new Date();
    const currentYear = now.getFullYear();
    
    // ============================================================
    // ✅ FIX: Sahi Birth Year Calculate Karne Ka Formula
    // ============================================================
    // Agar user sirf age de raha hai toh hum assume karte hain
    // ke uski birthday is saal aa chuki hai (simple formula)
    // Lekin hum user ko current year bhi dikhate hain taake
    // wo khud check kar sake ke calculation sahi hai ya nahi
    
    let birthYear = currentYear - age;
    
    // ✅ EXTRA: Agar user chahe toh hum exact date bhi pooch sakte hain
    // Lekin is tool mein sirf age input hai, toh yeh formula thek hai
    
    // Display results
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('birthYear').innerText = birthYear;
    document.getElementById('currentYearDisplay').innerText = currentYear;
}

// ============================================================
// INITIALIZATION
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    updateLiveTime();
    setInterval(updateLiveTime, 1000);
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('calculateBtn').addEventListener('click', calculateBirthYear);
    
    // ✅ Enter key press support
    document.getElementById('ageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            calculateBirthYear();
        }
    });
});
</script>
