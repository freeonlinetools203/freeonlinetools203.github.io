<div class="container">
    <div class="age-card">
        <div class="card-header">
            <h1>📅 Date Calculator</h1>
            <p>Calculate days between dates, add or subtract days, find day of week!</p>
        </div>
        <div class="card-content">
            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-diff">📊 Days Between</button>
                <button class="tab-btn" data-tab="tab-add">➕ Add Days</button>
                <button class="tab-btn" data-tab="tab-subtract">➖ Subtract Days</button>
            </div>

            <!-- Tab 1: Days Between -->
            <div class="tab-content active" id="tab-diff">
                <div class="input-group">
                    <label>📅 Start Date</label>
                    <input type="date" id="diffStart">
                </div>
                <div class="input-group">
                    <label>📅 End Date</label>
                    <input type="date" id="diffEnd">
                </div>
                <button class="calc-btn" onclick="calculateDaysBetween()">📊 Calculate Days</button>
            </div>

            <!-- Tab 2: Add Days -->
            <div class="tab-content" id="tab-add">
                <div class="input-group">
                    <label>📅 Start Date</label>
                    <input type="date" id="addDate">
                </div>
                <div class="input-group">
                    <label>➕ Number of Days to Add</label>
                    <input type="number" id="addDays" value="7" min="1">
                </div>
                <button class="calc-btn" onclick="calculateAddDays()">➕ Add Days</button>
            </div>

            <!-- Tab 3: Subtract Days -->
            <div class="tab-content" id="tab-subtract">
                <div class="input-group">
                    <label>📅 Start Date</label>
                    <input type="date" id="subDate">
                </div>
                <div class="input-group">
                    <label>➖ Number of Days to Subtract</label>
                    <input type="number" id="subDays" value="7" min="1">
                </div>
                <button class="calc-btn" onclick="calculateSubtractDays()">➖ Subtract Days</button>
            </div>

            <!-- Result Box -->
            <div class="result-box" id="dateResult">
                <div><span class="result-badge">📊 RESULT</span></div>
                <div class="result-value" id="dateResultValue">--</div>
                <div class="result-label" id="dateResultLabel">Result</div>
                <div class="result-detail" id="dateResultDetail"></div>
            </div>
        </div>
    </div>

<script>
// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(this.dataset.tab).classList.add('active');
        document.getElementById('dateResult').style.display = 'none';
    });
});

// Set default dates
function setDefaultDates() {
    const today = new Date();
    const start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 7);
    const end = new Date(today);
    
    document.getElementById('diffStart').value = start.toISOString().split('T')[0];
    document.getElementById('diffEnd').value = end.toISOString().split('T')[0];
    document.getElementById('addDate').value = start.toISOString().split('T')[0];
    document.getElementById('subDate').value = end.toISOString().split('T')[0];
}

function showDateResult(value, label, detail) {
    const result = document.getElementById('dateResult');
    result.style.display = 'block';
    document.getElementById('dateResultValue').innerText = value;
    document.getElementById('dateResultLabel').innerText = label;
    document.getElementById('dateResultDetail').innerText = detail || '';
}

function getDayName(date) {
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    return days[date.getDay()];
}

function calculateDaysBetween() {
    const start = new Date(document.getElementById('diffStart').value);
    const end = new Date(document.getElementById('diffEnd').value);
    if (isNaN(start) || isNaN(end)) {
        showDateResult('❌', 'Please select valid dates');
        return;
    }
    const diffTime = Math.abs(end - start);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    showDateResult(
        diffDays + ' days',
        'Days between dates',
        `Start: ${getDayName(start)}, ${start.toLocaleDateString()} | End: ${getDayName(end)}, ${end.toLocaleDateString()}`
    );
}

function calculateAddDays() {
    const start = new Date(document.getElementById('addDate').value);
    const days = parseInt(document.getElementById('addDays').value) || 0;
    if (isNaN(start)) {
        showDateResult('❌', 'Please select a valid date');
        return;
    }
    const result = new Date(start);
    result.setDate(result.getDate() + days);
    showDateResult(
        result.toLocaleDateString(),
        `+${days} days from ${start.toLocaleDateString()}`,
        `${getDayName(result)}, ${result.toLocaleDateString()}`
    );
}

function calculateSubtractDays() {
    const start = new Date(document.getElementById('subDate').value);
    const days = parseInt(document.getElementById('subDays').value) || 0;
    if (isNaN(start)) {
        showDateResult('❌', 'Please select a valid date');
        return;
    }
    const result = new Date(start);
    result.setDate(result.getDate() - days);
    showDateResult(
        result.toLocaleDateString(),
        `-${days} days from ${start.toLocaleDateString()}`,
        `${getDayName(result)}, ${result.toLocaleDateString()}`
    );
}

setDefaultDates();
document.getElementById('dateResult').style.display = 'none';
</script>
