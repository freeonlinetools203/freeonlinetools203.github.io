<div class="container">
    <div class="age-card">
        <div class="card-header">
            <h1>🎂 <span>Birth Year</span> Calculator</h1>
            <p>Enter your current age and find out exactly which year you were born!</p>
        </div>
        <div class="card-content">
            <div class="live-datetime">
                <div class="live-datetime-label">🟠 LIVE CURRENT TIME</div>
                <div class="live-date" id="liveDate">--</div>
                <div class="live-time" id="liveTime">--:--:--</div>
                <div class="live-timezone" id="liveTimezone">--</div>
            </div>

            <div class="input-group">
                <label>🎂 Enter Your Current Age</label>
                <div class="date-input-wrapper">
                    <input type="number" id="ageInput" placeholder="e.g., 25" min="1" max="150" style="width:100%;padding:16px 20px;font-size:16px;border:2px solid #fcd34d;border-radius:16px;font-family:inherit;">
                </div>
            </div>

            <button class="calc-btn" id="calculateBtn">✨ Find My Birth Year ✨</button>

            <div class="result-box" id="resultBox" style="display: none;">
                <span class="live-badge">🎉 YOUR BIRTH YEAR</span>
                <div class="main-age-label">You Were Born In</div>
                <div class="main-age-display"><span id="birthYear">0</span></div>
            </div>
        </div>

</div>

<script>
function updateLiveTime() {
    const now = new Date();
    const dateOpt = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('liveDate').innerText = now.toLocaleDateString(undefined, dateOpt);
    document.getElementById('liveTime').innerText = now.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: true });
    document.getElementById('liveTimezone').innerText = `Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;
}

function calculateBirthYear() {
    const age = parseInt(document.getElementById('ageInput').value);
    if (!age || age < 1) { alert('❌ Please enter a valid age!'); return; }
    if (age > 150) { alert('❌ Please enter a realistic age!'); return; }
    const currentYear = new Date().getFullYear();
    const birthYear = currentYear - age;
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('birthYear').innerText = birthYear;
}

document.addEventListener('DOMContentLoaded', function() {
    updateLiveTime();
    setInterval(updateLiveTime, 1000);
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('calculateBtn').addEventListener('click', calculateBirthYear);
});
</script>
